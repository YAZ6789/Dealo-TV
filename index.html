<!doctype html>
<html lang="en" data-theme="hud" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03060d" />
    <meta name="description" content="Dealo TV — your futuristic personal TV tracker with smart recommendations." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dealo TV" />
    <title>Dealo TV</title>
    <script>
      // Paint the saved theme before React boots (no flash of the default theme).
      try {
        var s = JSON.parse(localStorage.getItem('dealo:settings') || '{}');
        var st = s.state || {};
        var legacy = st.theme === 'daylight';
        if (st.theme) document.documentElement.dataset.theme = legacy ? 'aurora' : st.theme === 'surveillance' ? 'hud' : st.theme;
        var mode = legacy ? 'light' : st.mode || 'dark';
        if (mode === 'auto') mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (st.theme === 'contrast') mode = 'dark';
        document.documentElement.dataset.mode = mode;
        if (s.state && s.state.textScale) document.documentElement.style.fontSize = Math.round(s.state.textScale * 100) + '%';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
